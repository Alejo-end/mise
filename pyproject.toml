[project]
name = "safe-kitchen-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "httpx>=0.27",
    "cryptography>=42",
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
