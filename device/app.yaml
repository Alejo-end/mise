name: Safe Kitchen Agent
icon: 🥛
description: >
  A USB camera watches three taped shelf slots. When a slot runs low, the board
  sends an event to the Safe Kitchen backend. Modulino Knob sets the auto-order
  limit, Modulino Thermo watches the cold room, Modulino Buzzer beeps for approvals.
bricks:
  - arduino:web_ui
  # Declares that the app needs the camera. App Lab gives the container only the cameras
  # plugged in when the app starts, so plug the camera in before the board powers on.
  - arduino:camera_code_detection
