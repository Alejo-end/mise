<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">The three results of the rule check</title><desc id="d">What the agent may decide alone, what goes to the chef, and what nobody can approve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">What the agent may decide alone</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Every proposal gets one of three results, with the reasons and the version of the signed rule set.</text><rect x="24.0" y="78.0" width="292.0" height="270.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><rect x="38.0" y="92.0" width="95.3" height="28.0" rx="14" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.5"/><circle cx="53.0" cy="106.0" r="8.5" fill="#0ca30c"/><text x="53.0" y="110.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="68.0" y="110.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Allowed</text><text x="38.0" y="144.0" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">The agent orders alone</text><circle cx="43" cy="164" r="2.2" fill="#52514e"/><text x="54.0" y="168.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The usual product, or a substitute the</text><text x="54.0" y="184.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">rule set approves.</text><circle cx="43" cy="204.75" r="2.2" fill="#52514e"/><text x="54.0" y="208.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Under the spend limit of the knob and of</text><text x="54.0" y="225.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the rule set.</text><circle cx="43" cy="245.5" r="2.2" fill="#52514e"/><text x="54.0" y="249.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Inside the target stock and the weekly</text><text x="54.0" y="266.4" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">limit.</text><circle cx="43" cy="286.25" r="2.2" fill="#52514e"/><text x="54.0" y="290.2" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Arrives in time.</text><rect x="334.0" y="78.0" width="292.0" height="270.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><rect x="348.0" y="92.0" width="139.6" height="28.0" rx="14" fill="#fff4d6" stroke="#fab219" stroke-width="1.5"/><circle cx="363.0" cy="106.0" r="8.5" fill="#fab219"/><text x="363.0" y="110.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">!</text><text x="378.0" y="110.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Needs approval</text><text x="348.0" y="144.0" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">The chef decides on the phone</text><circle cx="353" cy="164" r="2.2" fill="#52514e"/><text x="364.0" y="168.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A substitute outside the approved list.</text><circle cx="353" cy="187.875" r="2.2" fill="#52514e"/><text x="364.0" y="191.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Over a limit, late, or more than 15%</text><text x="364.0" y="208.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">above the last standing order.</text><circle cx="353" cy="228.625" r="2.2" fill="#52514e"/><text x="364.0" y="232.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The cold room alarm is on.</text><circle cx="353" cy="252.5" r="2.2" fill="#52514e"/><text x="364.0" y="256.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Real catalog: no allergen data, or the</text><text x="364.0" y="273.4" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">ingredient text names an allergen the</text><text x="364.0" y="290.2" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">field does not.</text><rect x="644.0" y="78.0" width="292.0" height="270.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><rect x="658.0" y="92.0" width="105.7" height="28.0" rx="14" fill="#fbe7e7" stroke="#d03b3b" stroke-width="1.5"/><circle cx="673.0" cy="106.0" r="8.5" fill="#d03b3b"/><text x="673.0" y="110.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text><text x="688.0" y="110.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Forbidden</text><text x="658.0" y="144.0" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Nobody can approve it</text><circle cx="663" cy="164" r="2.2" fill="#52514e"/><text x="674.0" y="168.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Contains or may contain a banned</text><text x="674.0" y="184.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">allergen.</text><circle cx="663" cy="204.75" r="2.2" fill="#52514e"/><text x="674.0" y="208.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Breaks a must-have rule, for example</text><text x="674.0" y="225.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">milk that is not lactose-free.</text><circle cx="663" cy="245.5" r="2.2" fill="#52514e"/><text x="674.0" y="249.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Stand-in rule set: no allergen data.</text><circle cx="663" cy="269.375" r="2.2" fill="#52514e"/><text x="674.0" y="273.4" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Only a new signed version of the rule</text><text x="674.0" y="290.2" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">set changes this.</text><text x="24.0" y="384.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">Source: backend/rules.py and rules/school_kitchen.yaml. The signature is a recorded hash of the rule file, not a cryptographic signature.</text></svg>
