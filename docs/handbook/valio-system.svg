<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">The parts of the Valio entry</title><desc id="d">The kitchen on the left, our gateway in the middle and Valio&#x27;s challenge materials on the right.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="519" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">Who talks to whom</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Blue parts are our code. The model may search, compare and explain. Only the rule check decides.</text><rect x="24.0" y="76.0" width="236.0" height="400.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="38.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">THE KITCHEN</text><rect x="38.0" y="108.0" width="208.0" height="172.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Shelf box (Arduino UNO Q)</text><text x="50.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Camera: is a shelf slot full, low</text><text x="50.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">or empty.</text><text x="50.0" y="189.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Knob: lowers the spend limit.</text><text x="50.0" y="209.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Thermo: cold room alarm.</text><text x="50.0" y="230.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Buzzer: someone must approve.</text><rect x="38.0" y="292.0" width="208.0" height="94.9" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="315.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Chef&#x27;s phone</text><text x="50.0" y="336.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Up to three options with the</text><text x="50.0" y="353.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">trade-off of each. Approves with</text><text x="50.0" y="370.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">a PIN.</text><rect x="38.0" y="396.0" width="208.0" height="77.7" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="419.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">A text request</text><text x="50.0" y="440.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">“1,000 litres of lactose-free</text><text x="50.0" y="457.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">milk by Monday”</text><rect x="284.0" y="76.0" width="392.0" height="400.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="298.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">AIMO AGENT GATEWAY (OUR BACKEND)</text><rect x="298.0" y="108.0" width="176.0" height="122.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="310.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Buying pipeline</text><text x="310.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Search, quote, split partial</text><text x="310.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">stock, rank substitutes,</text><text x="310.0" y="186.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">ask again before the order.</text><rect x="486.0" y="108.0" width="176.0" height="122.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="498.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Rule check</text><text x="498.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Plain code and a rule set</text><text x="498.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the chef signed. Allowed,</text><text x="498.0" y="186.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">needs approval or</text><text x="498.0" y="203.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">forbidden, with a reason.</text><rect x="298.0" y="246.0" width="176.0" height="104.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="310.0" y="269.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Audit log</text><text x="310.0" y="290.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Append-only. A story for</text><text x="310.0" y="307.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the chef, the same entries</text><text x="310.0" y="324.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">as data for Valio.</text><rect x="486.0" y="246.0" width="176.0" height="104.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="498.0" y="269.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Catalog adapter</text><text x="498.0" y="290.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Search over the product</text><text x="498.0" y="307.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">file. Every answer keeps</text><text x="498.0" y="324.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">its source, time and hash.</text><rect x="298.0" y="364.0" width="364.0" height="98.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="310.0" y="387.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Agent Driving Test (sandbox)</text><text x="310.0" y="408.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">An outside agent must pass six scenarios on a copy of the</text><text x="310.0" y="425.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">catalog before it gets a licence.</text><rect x="700.0" y="76.0" width="236.0" height="400.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="714.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">VALIO&#x27;S CHALLENGE MATERIALS</text><rect x="714.0" y="108.0" width="208.0" height="122.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="726.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Product file</text><text x="726.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">17,546 products. Allergen</text><text x="726.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">codes, diet claims, storage</text><text x="726.0" y="186.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">temperature. 46% have no</text><text x="726.0" y="203.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">allergen data.</text><rect x="714.0" y="246.0" width="208.0" height="113.1" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="726.0" y="269.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Price API and availability</text><text x="726.0" y="288.1" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">API</text><text x="726.0" y="308.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Live, with an API key. Ask only</text><text x="726.0" y="325.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">for the few products you</text><text x="726.0" y="342.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">narrowed down.</text><rect x="714.0" y="364.0" width="208.0" height="98.0" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 4"/><text x="726.0" y="386.0" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Not offered by Valio</text><text x="726.0" y="406.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">No search and no order endpoint.</text><text x="726.0" y="422.2" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Search and the order book live in</text><text x="726.0" y="438.4" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">our gateway.</text><path d="M246.0 150.0L297.0 150.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="272.0" y="142.0" font-size="11" font-weight="500" fill="#52514e" text-anchor="middle">events</text><path d="M246.0 430.0L266.0 430.0L266.0 186.0L297.0 186.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M297.0 214.0L278.0 214.0L278.0 338.0L247.0 338.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M474.0 168.0L485.0 168.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M386.0 230.0L386.0 245.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452.0 230.0L452.0 238.0L574.0 238.0L574.0 245.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M662.0 280.0L688.0 280.0L688.0 168.0L713.0 168.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M662.0 312.0L713.0 312.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24.0" y="504.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">The pipeline runs on the real product file. The two live calls are not tested yet: no API key is on the laptop. Source: valio-challenge/backend/.</text></svg>
