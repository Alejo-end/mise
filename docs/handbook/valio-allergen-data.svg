<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">The real catalog under the kitchen&#x27;s allergen rules</title><desc id="d">Of 17,546 products, 11% are forbidden by the allergen data, 46% go to a person and 42% are clear.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">The real catalog under the school kitchen&#x27;s bans (nuts, peanuts, sesame)</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">All 17,546 products of the Valio challenge file, checked by the rule check. Counted on 14 November 2026.</text><rect x="25.0" y="96.0" width="100.0" height="28.0" rx="4" fill="#d03b3b" stroke="#d03b3b" stroke-width="1"/><text x="34.0" y="115.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">11%</text><rect x="127.0" y="96.0" width="421.6" height="28.0" rx="4" fill="#fab219" stroke="#fab219" stroke-width="1"/><text x="136.0" y="115.0" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">46%</text><rect x="550.5" y="96.0" width="384.5" height="28.0" rx="4" fill="#0ca30c" stroke="#0ca30c" stroke-width="1"/><text x="559.5" y="115.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">42%</text><rect x="24.0" y="150.0" width="128.0" height="28.0" rx="14" fill="#fbe7e7" stroke="#d03b3b" stroke-width="1.5"/><circle cx="39.0" cy="164.0" r="8.5" fill="#d03b3b"/><text x="39.0" y="168.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text><text x="54.0" y="168.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Forbidden</text><text x="232.0" y="169.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">1,962</text><text x="250.0" y="169.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The allergen codes say the product contains or may contain a banned allergen.</text><rect x="24.0" y="194.0" width="128.0" height="28.0" rx="14" fill="#fff4d6" stroke="#fab219" stroke-width="1.5"/><circle cx="39.0" cy="208.0" r="8.5" fill="#fab219"/><text x="39.0" y="212.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">!</text><text x="54.0" y="212.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">To a person</text><text x="232.0" y="213.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">8,149</text><text x="250.0" y="213.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">8,110 have no allergen data. 22 leave a banned allergen undeclared. For 17, only the ingredient text names it.</text><rect x="24.0" y="238.0" width="128.0" height="28.0" rx="14" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.5"/><circle cx="39.0" cy="252.0" r="8.5" fill="#0ca30c"/><text x="39.0" y="256.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="54.0" y="256.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Clear</text><text x="232.0" y="257.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">7,435</text><text x="250.0" y="257.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The data lists allergens or free-from codes, and none is banned.</text><rect x="24.0" y="290.0" width="912.0" height="40.0" rx="8" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="38.0" y="307.0" font-size="12.5" font-weight="500" fill="#0b0b0b" text-anchor="start">Two traps in the data: 69 products name a nut kind, for example almond, without the general nut code. An empty</text><text x="38.0" y="323.0" font-size="12.5" font-weight="500" fill="#0b0b0b" text-anchor="start">allergen field means “unknown”, not “none”: fruit and vegetables often have no data.</text><text x="24.0" y="364.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">“Missed” cannot be counted without a hand-checked sample. The code map is our reading of the GS1 list. Ask the Valio mentors to confirm it.</text></svg>
