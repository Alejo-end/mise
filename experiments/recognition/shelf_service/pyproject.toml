[project]
name = "valio-shelf-prototype"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "numpy>=2,<3", "pillow>=11,<14", "opencv-python-headless>=4.10,<5",
  "torch>=2.6,<3", "transformers==4.57.1", "pytest>=8,<10",
]
[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
